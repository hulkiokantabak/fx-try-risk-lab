name: Deploy Pages

on:
  push:
    branches: ["main"]
  # The daily "Refresh Browser Data" commit is pushed with the default
  # GITHUB_TOKEN, and GitHub does not start on:push workflows for such pushes.
  # Chain the deployment from the completed refresh run instead.
  workflow_run:
    workflows: ["Refresh Browser Data"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # After a data refresh, deploy only when the refresh succeeded. Direct
    # pushes and manual dispatches always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy an immutable commit. For push and dispatch this is the
          # triggering commit. For workflow_run, github.sha is the latest
          # commit on main when the refresh finished (its bot commit, if any),
          # not the refresh run's pre-refresh head_sha.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate browser bundle
        run: python scripts/validate_browser_bundle.py

      - name: Check browser JavaScript syntax
        run: node --check docs/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
